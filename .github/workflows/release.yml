# Fully automatic releases with release-please (Conventional Commits, see AGENTS.md):
#   push to main  → release-please opens/updates a "release PR" (next version + CHANGELOG)
#   merge that PR → tag + GitHub release are created, then this workflow
#                   builds and signs GifPaste.app, attaches the zip and updates the Homebrew cask.
#
# Secrets:
#   SIGNING_CERT_P12_BASE64, SIGNING_CERT_PASSWORD  (scripts/create-signing-cert.sh)
#   TAP_DEPLOY_KEY                                    (deploy key with write access to isibeni/homebrew-tap)
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          base64 --decode <<< "$P12_BASE64" > "$RUNNER_TEMP/signing.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

          # Sign by SHA-1 so codesign can't pick a wrong identity
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/"GifPaste Signing"/ {print $2; exit}')
          test -n "$IDENTITY" || { echo "Signing identity not found"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/build.sh zip

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "GifPaste-$VERSION.zip" --clobber

      - name: Update Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          SHA256=$(shasum -a 256 "GifPaste-$VERSION.zip" | cut -d' ' -f1)

          install -m 600 /dev/null "$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:isibeni/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" Casks/gifpaste.rb
          sed -i '' -E "s/^  sha256 .*/  sha256 \"$SHA256\"/" Casks/gifpaste.rb
          git diff

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "gifpaste $VERSION"
          git push
          rm "$RUNNER_TEMP/tap_key"
