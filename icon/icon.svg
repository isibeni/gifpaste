<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- background: deep indigo to warm coral -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E1F7A"/>
      <stop offset="0.55" stop-color="#7B2FBF"/>
      <stop offset="1" stop-color="#FF6B57"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A2391"/>
      <stop offset="1" stop-color="#C2338F"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A0B45" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824×824 body centered on 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  </g>

  <!-- motion trail behind the card (it was just "pasted in") -->
  <g fill="#FFFFFF" opacity="0.28">
    <rect x="150" y="440" width="100" height="22" rx="11"/>
    <rect x="180" y="500" width="70" height="22" rx="11"/>
    <rect x="150" y="560" width="100" height="22" rx="11"/>
  </g>

  <!-- the pasted GIF card, slightly tilted -->
  <g transform="rotate(-7 500 512)" filter="url(#cardShadow)">
    <rect x="290" y="350" width="420" height="324" rx="56" fill="#FFFFFF"/>
    <text x="500" y="568" text-anchor="middle"
          font-family="Inter Display" font-weight="900" font-size="178"
          letter-spacing="-4" fill="url(#text)">GIF</text>
  </g>

  <!-- text cursor (I-beam) where the GIF lands -->
  <g fill="#FFFFFF">
    <rect x="784" y="380" width="22" height="264" rx="11"/>
    <rect x="754" y="372" width="82" height="20" rx="10"/>
    <rect x="754" y="632" width="82" height="20" rx="10"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
