<svg xmlns="http://www.w3.org/2000/svg" width="30" height="18" viewBox="0 0 30 18" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Menu bar template icon: only the alpha channel is used, macOS tints it for light/dark mode. -->
  <defs>
    <mask id="knockout">
      <rect x="0" y="0" width="30" height="18" fill="#fff"/>
      <text x="11.5" y="12.4" text-anchor="middle" transform="rotate(-7 11.5 9)"
            font-family="Inter Display" font-weight="900" font-size="8.6" letter-spacing="-0.2"
            fill="#000">GIF</text>
    </mask>
  </defs>
  <!-- tilted GIF card with the letters cut out -->
  <rect x="1.5" y="3" width="20" height="12" rx="2.8" transform="rotate(-7 11.5 9)"
        fill="#000" mask="url(#knockout)"/>
  <!-- text cursor -->
  <g fill="#000">
    <rect x="25.2" y="3" width="1.6" height="12" rx="0.8"/>
    <rect x="23.6" y="2.2" width="4.8" height="1.5" rx="0.75"/>
    <rect x="23.6" y="14.3" width="4.8" height="1.5" rx="0.75"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
